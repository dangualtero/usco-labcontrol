<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Ilustración referencial de una balanza de lodos presurizada">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B4B63"/><stop offset="1" stop-color="#1B2433"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAFBFC"/><stop offset="1" stop-color="#A9B5C4"/></linearGradient>
    <linearGradient id="metalOsc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C7D0DC"/><stop offset=".5" stop-color="#EEF2F6"/><stop offset="1" stop-color="#9AA7B8"/></linearGradient>
    <linearGradient id="copa" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8C98AA"/><stop offset=".45" stop-color="#E7ECF2"/><stop offset="1" stop-color="#7E8A9C"/></linearGradient>
    <pattern id="puntos" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#DFD4A6" opacity=".14"/></pattern>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="900" height="600" fill="url(#fondo)"/>
  <rect width="900" height="600" fill="url(#puntos)"/>
  <rect y="478" width="900" height="122" fill="#0B1220" opacity=".4"/>
  <ellipse cx="450" cy="486" rx="250" ry="16" fill="#000" opacity=".35"/>
  <g filter="url(#sombra)">
    <!-- base y poste -->
    <path d="M360 482 L540 482 Q552 482 546 470 L520 424 L380 424 L354 470 Q348 482 360 482 Z" fill="url(#metal)"/>
    <rect x="436" y="282" width="28" height="146" rx="7" fill="url(#metalOsc)"/>
    <!-- viga graduada -->
    <rect x="150" y="248" width="610" height="28" rx="14" fill="url(#metal)"/>
    <g stroke="#475569" stroke-width="2.5" stroke-linecap="round">
      <line x1="490" y1="248" x2="490" y2="258"/><line x1="530" y1="248" x2="530" y2="258"/><line x1="570" y1="248" x2="570" y2="258"/>
      <line x1="610" y1="248" x2="610" y2="258"/><line x1="650" y1="248" x2="650" y2="258"/><line x1="690" y1="248" x2="690" y2="258"/>
    </g>
    <!-- fulcro -->
    <circle cx="450" cy="262" r="24" fill="#DFD4A6"/><circle cx="450" cy="262" r="9" fill="#5C0D12"/>
    <!-- jinete deslizante -->
    <rect x="572" y="214" width="40" height="34" rx="6" fill="#8F141B"/>
    <rect x="586" y="248" width="12" height="16" rx="3" fill="#5C0D12"/>
    <!-- contrapeso -->
    <rect x="722" y="276" width="52" height="78" rx="12" fill="url(#metalOsc)"/>
    <rect x="740" y="262" width="16" height="16" rx="3" fill="#8996A8"/>
    <!-- nivel de burbuja -->
    <rect x="402" y="232" width="96" height="16" rx="8" fill="#DFD4A6"/>
    <circle cx="450" cy="240" r="5" fill="#5C0D12"/>
    <!-- soporte de la copa -->
    <path d="M190 276 L190 306" stroke="#C7D0DC" stroke-width="8" stroke-linecap="round"/>
    <!-- tapa con émbolo de presión -->
    <rect x="178" y="300" width="24" height="20" rx="4" fill="url(#metalOsc)"/>
    <rect x="128" y="318" width="124" height="20" rx="8" fill="#DFD4A6"/>
    <!-- copa -->
    <path d="M138 338 L242 338 L236 438 Q236 448 226 448 L154 448 Q144 448 144 438 Z" fill="url(#copa)"/>
    <rect x="144" y="372" width="92" height="3" fill="#6B7788" opacity=".45"/>
    <rect x="144" y="402" width="92" height="3" fill="#6B7788" opacity=".45"/>
  </g>
  <text x="450" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#DFD4A6" letter-spacing="3">BALANZA DE LODOS PRESURIZADA</text>
  <text x="882" y="588" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" opacity=".6">Ilustración referencial</text>
</svg>
