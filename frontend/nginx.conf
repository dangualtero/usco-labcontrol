server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Fotografías: el frontend las reduce, pero se deja margen sobre el límite de 5 MB de la API.
  client_max_body_size 6m;

  include /etc/nginx/snippets/seguridad-headers.conf;

  # API Spring Boot (mismo dominio: no hace falta CORS)
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    # El backend ya envía sus propias cabeceras de seguridad: se ocultan para no duplicarlas.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
  }

  # Archivos con hash en el nombre: se pueden guardar en caché un año
  location /assets/ {
    include /etc/nginx/snippets/seguridad-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Rutas de React (/neiva/login, /pitalito/coordinador…): siempre index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
