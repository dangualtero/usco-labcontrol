# Cabeceras de seguridad (OWASP). Se incluyen en cada «location» de nginx.conf, porque nginx NO hereda los
# add_header del bloque server en una location que define los suyos propios.
#   - CSP: solo recursos del propio sitio. style-src admite 'unsafe-inline' porque React y los gráficos usan el
#     atributo style; img-src admite https: porque el coordinador puede poner la URL de una foto externa.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
