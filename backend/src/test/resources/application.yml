# Las pruebas automatizadas usan H2 en modo MySQL (no requieren servidor). La aplicación real usa MySQL.
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:labcontrol-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
labcontrol:
  jwt:
    secret: test-secret-usco-labcontrol-2026-0123456789abcdef-test
    expiracion-minutos: 30
    expiracion-recordar-dias: 7
  cors:
    origenes: http://localhost:5173
  seed:
    habilitado: true
    historial-ejemplo: true
  reglas:
    limite-equipos-por-usuario: 3
